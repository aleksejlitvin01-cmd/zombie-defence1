<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ZOMBIE DEFENCE</title>
<style>
  :root {
    --bg: #090b0f;
    --panel: #11151d;
    --card: #171c26;
    --line: #28303d;
    --gold: #ffc21a;
    --gold-bright: #ffe066;
    --ink: #f8fafc;
    --muted: #94a3b8;
    --ok: #10b981;
    --bad: #ef4444;
    --cyan: #38bdf8;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: #07090d;
    color: var(--ink);
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button {
    touch-action: manipulation;
  }

  #shell {
    position: relative;
    display: flex;
    width: min(99vw, calc((97dvh - 70px) * (16 / 9) + 290px));
    height: 97dvh;
    max-height: 97dvh;
    max-width: 1540px;
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: 10px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9);
    overflow: hidden;
  }

  #arena-col {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #07090d;
  }

  #viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: calc(100dvh - 150px);
    min-height: 0;
    flex: 0 0 auto;
    background: #07090d;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #hud-sys-btns {
    position: absolute;
    top: max(8px, var(--safe-top));
    right: max(8px, var(--safe-right));
    display: flex;
    gap: 6px;
    z-index: 8;
  }

  .sys-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 7px;
    border: 1.5px solid var(--gold);
    background: #141923;
    color: var(--gold);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sys-btn:hover { background: #1e2533; }
  .sys-btn:active { background: #263042; transform: scale(0.95); }
  .sys-btn svg { width: 18px; height: 18px; display: block; }

  /* Сенсорне керування стрілками для режиму Телефон */
  #touch-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 12;
    display: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #touch-controls.active { display: block; }

  #dpad-zone {
    position: absolute;
    left: max(12px, var(--safe-left));
    bottom: max(12px, var(--safe-bottom));
    display: grid;
    grid-template-columns: repeat(3, clamp(40px, 8.5vw, 50px));
    grid-template-rows: repeat(3, clamp(40px, 8.5vw, 50px));
    gap: 4px;
    pointer-events: auto;
    touch-action: none;
  }
  .dpad-btn {
    width: 100%;
    height: 100%;
    padding: 0;
    border-radius: 9px;
    border: 2px solid rgba(255, 194, 26, 0.45);
    background: rgba(17, 21, 29, 0.36);
    color: rgba(255, 194, 26, 0.85);
    font-size: clamp(14px, 3vw, 18px);
    font-weight: 900;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .dpad-btn.pressed,
  .dpad-btn:active {
    background: rgba(255, 194, 26, 0.78);
    color: #090b0f;
    border-color: rgba(255, 224, 102, 0.92);
    transform: scale(0.95);
  }
  .dpad-up    { grid-column: 2; grid-row: 1; }
  .dpad-left  { grid-column: 1; grid-row: 2; }
  .dpad-center{
    grid-column: 2;
    grid-row: 2;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 194, 26, 0.18);
    background: rgba(15, 20, 28, 0.16);
    pointer-events: none;
  }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down  { grid-column: 2; grid-row: 3; }

  /* Два окремі блоки керування для режиму 2 гравців на телефоні */
  #touch-controls.dual-p2 #dpad-zone {
    left: max(8px, var(--safe-left));
    bottom: max(10px, var(--safe-bottom));
    grid-template-columns: repeat(3, clamp(34px, 7vw, 42px));
    grid-template-rows: repeat(3, clamp(34px, 7vw, 42px));
    gap: 3px;
  }
  #touch-controls.dual-p2 #dpad-zone .dpad-btn {
    font-size: clamp(12px, 2.5vw, 15px);
    border-radius: 7px;
  }
  #touch-controls.dual-p2 #touch-actions {
    right: auto;
    left: calc(max(8px, var(--safe-left)) + 3 * clamp(34px, 7vw, 42px) + 12px);
    bottom: max(10px, var(--safe-bottom));
    flex-direction: column;
    gap: 5px;
    align-items: flex-start;
  }
  #touch-controls.dual-p2 .t-btn {
    min-height: 34px;
    padding: 6px 9px;
    font-size: 10px;
    border-radius: 8px;
  }
  #touch-controls.dual-p2 .t-btn.fire {
    min-height: 38px;
    padding: 8px 11px;
    font-size: 11px;
  }

  #p2-touch-pad {
    display: none;
    position: absolute;
    right: max(8px, var(--safe-right));
    bottom: max(10px, var(--safe-bottom));
    gap: 6px;
    align-items: flex-end;
    pointer-events: auto;
    touch-action: none;
  }
  #touch-controls.dual-p2 #p2-touch-pad {
    display: flex;
  }
  #p2-actions {
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: flex-end;
    touch-action: none;
  }
  #dpad-zone-p2 {
    display: grid;
    grid-template-columns: repeat(3, clamp(34px, 7vw, 42px));
    grid-template-rows: repeat(3, clamp(34px, 7vw, 42px));
    gap: 3px;
    touch-action: none;
  }
  #dpad-zone-p2 .dpad-btn {
    font-size: clamp(12px, 2.5vw, 15px);
    border-radius: 7px;
    border-color: rgba(56, 189, 248, 0.52);
    color: rgba(56, 189, 248, 0.88);
  }
  #dpad-zone-p2 .dpad-btn.pressed,
  #dpad-zone-p2 .dpad-btn:active {
    background: rgba(56, 189, 248, 0.78);
    color: #090b0f;
    border-color: rgba(186, 230, 253, 0.92);
  }
  #dpad-zone-p2 .dpad-center {
    border-color: rgba(56, 189, 248, 0.22);
  }
  #touch-controls.dual-p2 .t-btn.p2-btn {
    border-color: rgba(56, 189, 248, 0.55);
    color: rgba(56, 189, 248, 0.9);
  }
  #touch-controls.dual-p2 .t-btn.p2-btn.fire {
    background: rgba(56, 189, 248, 0.65);
    color: #090b0f;
  }
  #touch-controls.dual-p2 .t-btn.p2-btn.fire.pressed,
  #touch-controls.dual-p2 .t-btn.p2-btn.fire:active {
    background: rgba(186, 230, 253, 0.9);
  }

  #touch-actions {
    position: absolute;
    right: max(12px, var(--safe-right));
    bottom: max(12px, var(--safe-bottom));
    display: flex;
    gap: 8px;
    align-items: flex-end;
    pointer-events: auto;
    touch-action: none;
  }
  .t-btn {
    min-height: 46px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 2px solid rgba(255, 194, 26, 0.48);
    background: rgba(17, 21, 29, 0.38);
    color: rgba(255, 194, 26, 0.88);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.4px;
    cursor: pointer;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .t-btn.p2-active {
    border-color: rgba(56, 189, 248, 0.55);
    color: rgba(56, 189, 248, 0.9);
  }
  .t-btn:active {
    transform: scale(0.96);
    background: rgba(255, 194, 26, 0.28);
  }
  .t-btn.fire {
    min-height: 52px;
    padding: 13px 18px;
    background: rgba(255, 194, 26, 0.65);
    color: #090b0f;
    border-color: rgba(255, 224, 102, 0.72);
    font-size: 13px;
    font-weight: 900;
  }
  .t-btn.fire.pressed,
  .t-btn.fire:active {
    background: rgba(255, 224, 102, 0.9);
    transform: scale(0.96);
  }

  /* Нижня панель здібностей та мін */
  #ability-dock {
    height: 68px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    padding: 7px 8px;
    background: #0d1017;
    border-top: 2px solid var(--gold);
    flex-shrink: 0;
  }
  #ability-dock.menu-hidden { display: none !important; }
  .ab-slot {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 8px;
    border-radius: 7px;
    border: 1.5px solid #2b3444;
    background: #151a24;
    color: var(--ink);
    cursor: pointer;
    overflow: hidden;
    text-align: left;
    min-width: 0;
  }
  .ab-slot:hover:not(:disabled) { border-color: var(--gold); background: #1c2330; }
  .ab-slot:active:not(:disabled) { border-color: var(--gold-bright); background: #242d3e; }
  .ab-slot:disabled { opacity: 0.42; cursor: not-allowed; }

  .ab-hotkey {
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 9px;
    font-weight: 900;
    color: var(--gold);
    background: #090b0f;
    border: 1px solid rgba(255, 194, 26, 0.45);
    padding: 0 4px;
    border-radius: 3px;
  }

  .ab-svg-box {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #0b0e14;
    border: 1px solid #28303d;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ab-svg-box svg { width: 18px; height: 18px; display: block; }

  .ab-meta { flex: 1; min-width: 0; }
  .ab-title {
    font-size: 10.5px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ab-mana {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    font-weight: 800;
    color: var(--gold);
    margin-top: 2px;
  }
  .ab-mana svg { width: 10px; height: 10px; display: block; }

  .ab-cooldown-mask {
    position: absolute;
    inset: 0;
    background: rgba(7, 9, 13, 0.84);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: var(--gold);
    pointer-events: none;
  }

  /* Правий магазин */
  #arsenal-panel {
    width: 290px;
    flex-shrink: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 2px solid var(--gold);
  }
  #arsenal-panel.menu-hidden { display: none !important; }
  #arsenal-top {
    padding: 10px 12px;
    background: #141923;
    border-bottom: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #arsenal-top h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gold);
  }

  #gold-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 6px;
    background: #0b0e14;
    border: 1.5px solid var(--gold);
    font-size: 13px;
    font-weight: 900;
    color: var(--gold);
  }
  #gold-badge svg { width: 14px; height: 14px; display: block; }

  #arsenal-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: #0c0f15;
    border-bottom: 1.5px solid var(--line);
  }
  .tab-switch {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 4px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-switch svg { width: 13px; height: 13px; display: block; flex-shrink: 0; }
  .tab-switch:hover { color: var(--ink); }
  .tab-switch.active {
    color: var(--gold);
    background: rgba(255, 194, 26, 0.12);
    border-bottom-color: var(--gold);
  }

  #arsenal-tabs {
    flex: 0 0 auto;
  }

  #arsenal-items {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #arsenal-items::-webkit-scrollbar { width: 5px; height: 5px; }
  #arsenal-items {
    touch-action: pan-y;
  }
  #arsenal-items::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

  .item-card {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 9px;
    border-radius: 7px;
    border: 1.5px solid #283141;
    background: #161b26;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
  }
  .item-card:hover:not(:disabled) { border-color: var(--gold); background: #1d2433; }
  .item-card:active:not(:disabled) { border-color: var(--gold-bright); background: #242d3e; }
  .item-card:disabled { opacity: 0.45; cursor: not-allowed; }

  .card-icon {
    width: 36px;
    height: 32px;
    border-radius: 6px;
    background: #0b0e14;
    border: 1px solid #283141;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-icon svg { width: 26px; height: 20px; display: block; }

  .card-info { flex: 1; min-width: 0; }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 800;
  }
  .card-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 900;
    color: var(--gold);
    white-space: nowrap;
  }
  .card-tag svg { width: 11px; height: 11px; display: block; }
  .card-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.25;
  }

  #arsenal-hint {
    padding: 7px 10px;
    font-size: 10px;
    color: var(--muted);
    background: #0c0f15;
    border-top: 1.5px solid var(--line);
    line-height: 1.35;
  }

  /* Екрани меню / паузи / поразки */
  .screen-layer {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 42%, #151a24 0%, #07090d 95%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    padding-top: max(46px, calc(var(--safe-top) + 34px));
    padding-bottom: max(14px, var(--safe-bottom));
    text-align: center;
    overflow-y: auto;
    overscroll-behavior: contain;
    z-index: 25;
  }
  .screen-layer.hidden { display: none !important; }

  #device-switch {
    position: absolute;
    top: max(10px, var(--safe-top));
    right: max(10px, var(--safe-right));
    display: flex;
    gap: 4px;
    background: #10141c;
    padding: 3px;
    border-radius: 8px;
    border: 1.5px solid var(--gold);
    z-index: 2;
  }
  .dev-btn,
  .lang-btn {
    padding: 6px 11px;
    border-radius: 6px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .dev-btn.active,
  .lang-btn.active {
    background: var(--gold);
    color: #090b0f;
  }

  .lang-switch {
    position: absolute;
    top: max(10px, var(--safe-top));
    left: max(10px, var(--safe-left));
    display: flex;
    gap: 4px;
    background: #10141c;
    padding: 3px;
    border-radius: 8px;
    border: 1.5px solid var(--gold);
    z-index: 2;
  }
  .lang-switch.inline {
    position: static;
    margin-top: 14px;
  }

  .hero-title {
    margin: 0;
    font-size: clamp(24px, 5vw, 60px);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--gold);
    text-shadow: 0 4px 0 #000;
    line-height: 1.05;
  }

  .hero-lead {
    margin: 8px 0 14px;
    font-size: clamp(12px, 1.8vw, 15px);
    color: var(--muted);
    max-width: 660px;
    line-height: 1.4;
  }

  .cfg-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
  }

  .seg-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 15px;
    border-radius: 9px;
    border: 2px solid #2b3444;
    background: #151a24;
    color: var(--ink);
    font-size: clamp(12px, 1.8vw, 15px);
    font-weight: 800;
    cursor: pointer;
  }
  .seg-btn svg { width: 16px; height: 16px; display: block; flex-shrink: 0; }
  .seg-btn:hover { border-color: var(--gold); }
  .seg-btn.active {
    background: var(--gold);
    border-color: var(--gold-bright);
    color: #090b0f;
  }

  .cta-deploy {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 12px 30px;
    border-radius: 10px;
    border: 2px solid var(--gold-bright);
    background: var(--gold);
    color: #090b0f;
    font-size: clamp(14px, 2.2vw, 18px);
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 0 #8a6400;
  }
  .cta-deploy svg { width: 18px; height: 18px; display: block; flex-shrink: 0; }
  .cta-deploy:hover { filter: brightness(1.07); }
  .cta-deploy:active { transform: translateY(2px); }

  .briefing-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 680px;
    text-align: left;
  }
  .brief-card {
    background: #121720;
    border: 1.5px solid #28303d;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 11.5px;
    line-height: 1.45;
  }
  .brief-card header {
    font-weight: 900;
    font-size: 12px;
    margin-bottom: 3px;
    color: var(--gold);
    text-transform: uppercase;
  }

  .debrief-table {
    background: #121720;
    border: 1.5px solid var(--gold);
    border-radius: 8px;
    padding: 12px 22px;
    margin: 10px 0 16px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 24px;
    text-align: left;
    font-size: 13px;
  }
  .debrief-table span { color: var(--muted); }
  .debrief-table strong { color: var(--gold); float: right; margin-left: 12px; }

  @media (max-width: 860px) and (orientation: portrait) {
    #shell {
      flex-direction: column;
      width: 100vw;
      max-width: 100vw;
      height: auto;
      max-height: 100dvh;
      border-radius: 0;
      border-width: 0;
    }
    #arena-col {
      flex: 0 0 auto;
      width: 100%;
    }
    #viewport {
      width: 100vw;
      height: calc(100vw * 9 / 16);
      max-height: 46dvh;
      aspect-ratio: 16 / 9;
    }
    #ability-dock {
      height: auto;
      min-height: 50px;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 5px 6px;
    }
    .ab-slot {
      padding: 4px 6px;
      gap: 5px;
    }
    .ab-hotkey { display: none; }
    .ab-svg-box {
      width: 24px;
      height: 24px;
    }
    .ab-svg-box svg { width: 15px; height: 15px; }
    .ab-title { font-size: 10px; }
    .ab-mana { font-size: 9.5px; margin-top: 1px; }

    #arsenal-panel {
      width: 100%;
      flex: 0 0 42dvh;
      height: 42dvh;
      min-height: 0;
      max-height: 42dvh;
      padding-bottom: var(--safe-bottom);
      border-left: 0;
      border-top: 2px solid var(--gold);
      overflow: hidden;
    }

  function detectLang() {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && I18N[saved]) return saved;
    } catch (e) {}
    const nav = String((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
    if (nav.startsWith('uk')) return 'uk';
    if (nav.startsWith('ru')) return 'ru';
    return 'en';
  }

  let curLang = detectLang();

  function tr(key, params) {
    let s = (I18N[curLang] && I18N[curLang][key]);
    if (s === undefined) s = I18N.uk[key];
    if (s === undefined) return key;
    if (params) {
      for (const k in params) s = s.split('{' + k + '}').join(String(params[k]));
    }
    return s;
  }

    Math.min(window.innerWidth, window.innerHeight) <= 640;

  let config = { players: 2, diff: 0, device: prefersPhoneInitially ? 'phone' : 'pc' };
  let activeTab = 'upgrades';
  let soundEnabled = true;
  let audioCtx = null;

  let running = false;
  let paused = false;
  let state = null;
  let players = [];
  let Z = [];
  let bullets = [];
  let mines = [];
  let particles = [];
  let shells = [];
  let texts = [];
  let crates = [];
  let beams = [];
  let shockwaves = [];
  let roadMarks = [];

  const keys = {};
  const touchDirsByPlayer = [
    { up: null, down: null, left: null, right: null },
    { up: null, down: null, left: null, right: null }
  ];
  const touchFireState = [
    { held: false, id: null },
    { held: false, id: null }
  ];
  const activePointers = new Map();
  let shopStructKey = '';
  let shopTabShown = '';
  let shopLive = [];
  let lastGoldShown = -1;

  function setFirePressed(playerIdx, pressed) {
    const f = touchFireState[playerIdx];
    if (!f) return;
    f.held = !!pressed;
    const fireBtn = $(playerIdx === 1 ? 't-fire-p2' : 't-fire');
    if (fireBtn) fireBtn.classList.toggle('pressed', f.held);
  }

  function syncDpadPressedClasses() {
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const pIdx = Number(btn.dataset.player || 0);
      const dir = btn.dataset.dir;
      btn.classList.toggle('pressed', touchDirsByPlayer[pIdx] && touchDirsByPlayer[pIdx][dir] !== null);
    });
  }

  function releasePointer(pointerId) {
    const data = activePointers.get(pointerId);
    if (!data) return;

    if (data.type === 'dir') {
      if (touchDirsByPlayer[data.player] &&
          touchDirsByPlayer[data.player][data.dir] === pointerId) {
        touchDirsByPlayer[data.player][data.dir] = null;
      }
      syncDpadPressedClasses();
    } else if (data.type === 'fire') {
      if (touchFireState[data.player] &&
          touchFireState[data.player].id === pointerId) {
        touchFireState[data.player].id = null;
        setFirePressed(data.player, false);
      }
    }

    activePointers.delete(pointerId);
  }

  function clearTouchInputs() {
    for (let pIdx = 0; pIdx < 2; pIdx++) {
      for (const dir of Object.keys(touchDirsByPlayer[pIdx])) {
        touchDirsByPlayer[pIdx][dir] = null;
      }
      touchFireState[pIdx].id = null;
      setFirePressed(pIdx, false);
    }
    syncDpadPressedClasses();
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'bullet' || type === 'ak') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(type === 'ak' ? 370 : 450, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.05);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'shotgun') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.13);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.start(now); osc.stop(now + 0.13);
      } else if (type === 'sniper') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(115, now + 0.15);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
      } else if (type === 'plasma') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(760, now);
        osc.frequency.exponentialRampToValueAtTime(210, now + 0.09);
        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.start(now); osc.stop(now + 0.09);
      } else if (type === 'minigun') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(310 + Math.random() * 50, now);
        osc.frequency.exponentialRampToValueAtTime(75, now + 0.04);
        gain.gain.setValueAtTime(0.035, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.start(now); osc.stop(now + 0.04);
      } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(115, now);
        osc.frequency.exponentialRampToValueAtTime(24, now + 0.32);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.start(now); osc.stop(now + 0.32);
      } else if (type === 'shieldHit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(290, now + 0.06);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      } else if (type === 'coin' || type === 'buy') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(type === 'buy' ? 580 : 780, now);
        osc.frequency.setValueAtTime(type === 'buy' ? 880 : 1060, now + 0.05);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.14);
        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.start(now); osc.stop(now + 0.14);
      }
    } catch (e) {}
  }

  function crateLabel(pl) {
    if (pl.kind === 'weapon') return `${wName(pl.weaponId)} (${pl.ammo})`;
    if (pl.kind === 'ammo') return `+${pl.ammo} ${wName(pl.weaponId)}`;
    return tr('crate.gold', { n: pl.amount });
  }

  function bannerLabel() {
    return state.bannerBoss
      ? tr('banner.boss', { n: state.bannerWave })
      : tr('banner.wave', { n: state.bannerWave });
  }

  function renderGameOver() {
    if (!state) return;
    const acc = state.shotsFired > 0 ? Math.round((state.shotsHit / state.shotsFired) * 100) : 0;
    $('go-desc').textContent = tr('over.desc', { w: state.wave, d: tr('diff.' + state.diff.id) });
    $('go-metrics').innerHTML = `
      <div><span>${tr('over.waves')}</span><strong>${state.wave}</strong></div>
      <div><span>${tr('over.kills')}</span><strong>${state.kills}</strong></div>
      <div><span>${tr('over.gold')}</span><strong>${Math.floor(state.totalGold)}</strong></div>
      <div><span>${tr('over.acc')}</span><strong>${acc}%</strong></div>
    `;
  }

  function applyStaticI18n() {
    document.documentElement.lang = curLang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = tr(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', tr(el.dataset.i18nAria)); });
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      btn.setAttribute('aria-label', `${Number(btn.dataset.player || 0) + 1} ${tr('dir.' + btn.dataset.dir)}`);
    });
    $('dpad-zone').setAttribute('aria-label', tr('aria.dpad', { p: 1 }));
    $('dpad-zone-p2').setAttribute('aria-label', tr('aria.dpad', { p: 2 }));
    $('p2-touch-pad').setAttribute('aria-label', tr('aria.pad2'));
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === curLang);
    });
  }

  function setLanguage(lang) {
    if (!I18N[lang]) return;
    curLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStaticI18n();
    buildAbilityDock();
    syncAbilityDock();
    syncShopUI();
    renderGameOver();
  }

  function buildLangSwitches() {
    ['lang-switch-menu', 'lang-switch-pause'].forEach(id => {
      const box = $(id);
      if (!box) return;
      Object.keys(LANG_LABELS).forEach(code => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'lang-btn';
        b.dataset.lang = code;
        b.textContent = LANG_LABELS[code];
        b.addEventListener('click', e => {
          e.currentTarget.blur();
          setLanguage(code);
        });
        box.appendChild(b);
      });
    });

    const dock = $('ability-dock');
    dock.innerHTML = '';

    ABILITIES.forEach((ab, idx) => {

  // Список товарів поточної вкладки. Кожен товар має enabled() — динамічну
  // перевірку доступності, щоб кнопки НЕ перебудовувались при зміні золота.
  function getShopItems() {
    const items = [];

    if (activeTab === 'upgrades') {
      const barLvl = state.barricade.level;
      const barMaxed = barLvl >= BARRICADE_LEVELS.length;
      const barCost = upgradeCost(110, barLvl);
      const nextBar = barMaxed ? tr('shop.maxLvl') : `${barName(barLvl + 1)} (${barLvl + 1}/7)`;

      items.push({
        id: 'barricade',
        icon: ICONS.upgArmor,
        title: tr('shop.line', { l: barLvl }),
        tag: barMaxed ? tr('shop.max') : ICONS.coin + barCost,
        sub: tr('shop.lineSub', { n: nextBar }),
        enabled: () => running && !barMaxed && state.gold >= barCost,
        run: () => {
          state.gold -= barCost;
          state.barricade.level++;
          state.barricade.hp = BARRICADE_LEVELS[state.barricade.level - 1].hp;
        }
      });

      const infUpgrades = [
        { id: 'dmg', icon: ICONS.upgBolt, title: tr('upg.dmg', { l: state.dmgLvl + 1 }), cost: upgradeCost(135, state.dmgLvl), sub: tr('upg.dmg.d'),
          apply: () => state.dmgLvl++ },
        { id: 'fire', icon: ICONS.wAK, title: tr('upg.fire', { l: state.fireRateLvl + 1 }), cost: upgradeCost(150, state.fireRateLvl), sub: tr('upg.fire.d'),
          apply: () => state.fireRateLvl++ },
        { id: 'turret', icon: ICONS.tGatling, title: tr('upg.turret', { l: state.turretLvl + 1 }), cost: upgradeCost(170, state.turretLvl), sub: tr('upg.turret.d'),
          apply: () => state.turretLvl++ },
        { id: 'gold', icon: ICONS.coin, title: tr('upg.gold', { l: state.goldLvl + 1 }), cost: upgradeCost(130, state.goldLvl), sub: tr('upg.gold.d'),
          apply: () => state.goldLvl++ },
        { id: 'mana', icon: ICONS.mana, title: tr('upg.mana', { l: state.manaLvl + 1 }), cost: upgradeCost(120, state.manaLvl), sub: tr('upg.mana.d'),
          apply: () => state.manaLvl++ },
        { id: 'base', icon: ICONS.upgArmor, title: tr('upg.base', { l: state.wallLvl + 1 }), cost: upgradeCost(150, state.wallLvl), sub: tr('upg.base.d'),
          apply: () => {
            state.wallLvl++;
            state.maxBaseHp += 250;
            state.baseHp = Math.min(state.maxBaseHp, state.baseHp + 250);
          } }
      ];

      infUpgrades.forEach(u => {
        items.push({
          id: 'upg-' + u.id,
          icon: u.icon,
          title: u.title,
          tag: ICONS.coin + u.cost,
          sub: u.sub,
          enabled: () => running && state.gold >= u.cost,
          run: () => {
            state.gold -= u.cost;
            u.apply();
          }
        });
      });
    } else if (activeTab === 'turrets') {
      const placedCount = state.turrets.filter(Boolean).length;
      const full = placedCount >= state.turrets.length;

      TURRET_TYPES.forEach(tt => {
        items.push({
          id: 'buy-' + tt.id,
          icon: tt.svg,
          title: turName(tt.id),
          tag: full ? `${placedCount}/10` : ICONS.coin + tt.price,
          sub: tr('shop.slots', { d: turDesc(tt.id), n: placedCount }),
          enabled: () => running && !full && state.gold >= tt.price,
          run: () => {
            const slot = state.turrets.findIndex(x => x === null);
            if (slot === -1) return;
            state.gold -= tt.price;
            state.turrets[slot] = { type: tt.id, cd: 10, angle: 0, recoil: 0 };
          }
        });
      });

      state.turrets.forEach((tur, idx) => {
        if (!tur) return;
        const cfg = TURRET_TYPES[tur.type];
        const refund = Math.round(cfg.price * 0.6);
        const zone = idx < 4 ? tr('zone.roof') : (idx < 8 ? tr('zone.wall') : tr('zone.line'));
        items.push({
          id: `rem-${idx}-${tur.type}`,
          icon: cfg.svg,
          title: tr('shop.remove', { n: turShort(tur.type) }),
          titleColor: '#f87171',
          tag: '+' + ICONS.coin + refund,
          sub: tr('shop.slotInfo', { n: idx + 1, z: zone }),
          enabled: () => running && !!state.turrets[idx],
          run: () => {
            if (!state.turrets[idx]) return;
            state.turrets[idx] = null;
            state.gold += refund;
            state.totalGold += refund;
            const tp = turretPos(idx);
            addFloatingText(tp.x, tp.y - 12, tr('float.dismantle', { n: refund }), '#ffc21a');
          }
        });
      });
    } else {
      items.push({
        id: 'sup-repair',
        icon: ICONS.abRepair,
        title: tr('sup.repair'),
        tag: ICONS.coin + 90,
        sub: tr('sup.repair.d'),
        enabled: () => running && state.baseHp < state.maxBaseHp && state.gold >= 90,
        run: () => {
          state.gold -= 90;
          state.baseHp = Math.min(state.maxBaseHp, state.baseHp + 250);
        }
      });
      items.push({
        id: 'sup-mana',
        icon: ICONS.mana,
        title: tr('sup.mana'),
        tag: ICONS.coin + 75,
        sub: tr('sup.mana.d'),
        enabled: () => running && state.mana < state.maxMana && state.gold >= 75,
        run: () => {
          state.gold -= 75;
          state.mana = Math.min(state.maxMana, state.mana + 50);
        }
      });
      items.push({
        id: 'sup-crate',
        icon: ICONS.abCrate,
        title: tr('sup.crate'),
        tag: ICONS.coin + 140,
        sub: tr('sup.crate.d'),
        enabled: () => running && state.gold >= 140,
        run: () => {
          state.gold -= 140;
          spawnCrate(rand(LINE_X + 60, W - 95), rand(Y_MIN + 22, Y_MAX - 16), true);
        }
      });
    }

    return items;
  }

  function createShopButton(item, i) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'item-card';
    btn.innerHTML = `
      <div class="card-icon">${item.icon}</div>
      <div class="card-info">
        <div class="card-head">
          <span${item.titleColor ? ` style="color:${item.titleColor}"` : ''}>${item.title}</span>
          <span class="card-tag">${item.tag}</span>
        </div>
        <div class="card-sub">${item.sub}</div>
      </div>
    `;
    btn.addEventListener('click', e => {
      e.currentTarget.blur();
      const it = shopLive[i];
      if (!state || !it || !it.enabled()) return;
      it.run();
      playSound('buy');
      syncShopUI();
    });
    return btn;
  }

  // Магазин перебудовується ТІЛЬКИ коли змінюється його вміст (рівні, ціни, турелі,
  // мова, вкладка). Зміна золота/мани/міцності лише перемикає disabled на наявних
  // кнопках — тому нічого не блимає і кліки не губляться.
  function syncShopUI() {
    if (!state) return;
    const goldInt = Math.floor(state.gold);
    if (goldInt !== lastGoldShown) {
      lastGoldShown = goldInt;
      const gv = $('gold-val');
      if (gv) gv.textContent = String(goldInt);
    }

    const items = getShopItems();
    shopLive = items;

    const structKey = curLang + '\u0003' + activeTab + '\u0003' +
      items.map(it => [it.id, it.title, it.tag, it.sub].join('\u0001')).join('\u0002');

    const list = $('arsenal-items');
    if (structKey !== shopStructKey) {
      const sameTab = shopTabShown === activeTab;
      const prevScroll = list.scrollTop;
      shopStructKey = structKey;
      shopTabShown = activeTab;

      const frag = document.createDocumentFragment();
      items.forEach((it, i) => frag.appendChild(createShopButton(it, i)));
      list.textContent = '';
      list.appendChild(frag);
      list.scrollTop = sameTab ? prevScroll : 0;
    }

    const btns = list.children;
    for (let i = 0; i < items.length; i++) {
      const b = btns[i];
      if (!b) continue;
      const disabled = !items[i].enabled();
      if (b.disabled !== disabled) b.disabled = disabled;
    }
  }

  function syncAbilityDock() {
    if (!state) return;
    ABILITIES.forEach((ab, idx) => {
      const btn = $(`ab-slot-${idx}`);
      const cdEl = $(`ab-cd-${idx}`);
      const cd = state.abilityCd[idx];
      const nextDisabled = !running || paused || state.mana < ab.cost || cd > 0;
      if (btn.disabled !== nextDisabled) btn.disabled = nextDisabled;

      if (cd > 0) {
        cdEl.style.display = 'flex';
        const sec = tr('cd.sec', { n: (cd / 60).toFixed(1) });
        if (cdEl.textContent !== sec) cdEl.textContent = sec;
      } else if (cdEl.style.display !== 'none') {
        cdEl.style.display = 'none';
      }
    });
  }

  function applyDeviceMode() {
    const isPhone = config.device === 'phone';
    const isDualPhone = isPhone && config.players === 2;
    const tc = $('touch-controls');
    tc.classList.toggle('active', isPhone && running && !paused);
    tc.classList.toggle('dual-p2', isDualPhone);
    if (!isPhone || !running || paused) {
      activePointers.forEach((_, id) => releasePointer(id));
      clearTouchInputs();
    }
    const inMenu = !running;
    $('arsenal-panel').classList.toggle('menu-hidden', inMenu);
    $('ability-dock').classList.toggle('menu-hidden', inMenu);
  }

  function syncDeviceButtons() {
    document.querySelectorAll('.dev-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.dev === config.device);
    });
  }

  function startGame() {
    clearTouchInputs();
    const diff = DIFFICULTIES[config.diff];
    state = {
      diff,
      baseHp: 850,
      maxBaseHp: 850,
      gold: 150,
      totalGold: 150,
      mana: 60,
      maxMana: 100,
      wave: 0,
      spawnQueue: [],
      waveTotal: 1,
      spawnTimer: 0,
      spawnGap: 55,
      waveBreak: 70,
      time: 0,
      ticks: 0,
      kills: 0,
      shotsFired: 0,
      shotsHit: 0,
      turrets: Array(TURRET_SLOTS.length).fill(null),
      barricade: { level: 0, hp: 0, hitFlash: 0 },
      dmgLvl: 0,
      fireRateLvl: 0,
      turretLvl: 0,
      goldLvl: 0,
      manaLvl: 0,
      wallLvl: 0,
      slowTimer: 0,
      shieldTimer: 0,
      flashTimer: 0,
      baseHitFlash: 0,
      crateTimer: 360,
      bannerWave: 0,
      bannerBoss: false,
      bannerTimer: 0,
      abilityCd: [0, 0, 0, 0, 0, 0]
    };

    players = [createPlayer(0, 292, 360, '#ffc21a', '#b45309')];
    if (config.players === 2) {
      players.push(createPlayer(1, 292, 445, '#38bdf8', '#0284c7'));
    } else if (config.players === 3) {
      players.push(createPlayer(1, 292, 445, '#38bdf8', '#0284c7', true));
    }

    Z = [];
    bullets = [];
    mines = [];
    particles = [];
    shells = [];
    texts = [];
    crates = [];
    beams = [];
    shockwaves = [];

    roadMarks = [];
    for (let i = 0; i < 16; i++) {
      roadMarks.push({
        x: rand(LINE_X + 25, W - 20),
        y: rand(Y_MIN + 14, Y_MAX - 10),
        w: rand(20, 52)
      });
    }

    spawnCrate(620, 405, true);

    $('screen-menu').classList.add('hidden');
    $('screen-pause').classList.add('hidden');
    $('screen-gameover').classList.add('hidden');

    running = true;
    paused = false;
    accumulator = 0;
    lastTime = performance.now();
    shopStructKey = '';
    lastGoldShown = -1;
    applyDeviceMode();
    playSound('powerup');
    syncShopUI(true);
    syncAbilityDock();
  }

  function createPlayer(idx, x, y, color, darkColor, isBot = false) {
    return {
      idx,
      x,
      y,
      hp: 100,
      maxHp: 100,
      color,
      darkColor,
      isBot,
      botCd: 0,
      face: 1,
      weaponId: 0,
      unlockedWeapons: [0],
      ammo: [Infinity, 0, 0, 0, 0, 0],
      lastShot: -999,
      recoil: 0,
      gunAnim: 0,
      gunAnimType: 'bullet',
      deadTimer: 0,
      moving: false,
      hitFlash: 0
    };
  }

  function startNextWave() {
    const w = ++state.wave;
    if (w > 1) {
      const bonus = Math.round((45 + w * 12) * (1 + 0.2 * state.goldLvl));
      state.gold += bonus;
      state.totalGold += bonus;
      addFloatingText(LINE_X + 110, Y_MIN + 35, tr('float.wave', { n: bonus }), '#ffc21a');
    }

    const waveDrops = Math.min(5, 1 + Math.floor(w / 2));
    for (let d = 0; d < waveDrops; d++) {
      spawnCrate(rand(LINE_X + 60, W - 95), rand(Y_MIN + 22, Y_MAX - 16), d === 0);
    }

    const count = Math.round((8 + w * 3.5) * state.diff.countMult);
    state.spawnQueue = [];
    for (let i = 0; i < count; i++) {
      const r = Math.random();
      if (w >= 5 && r > 0.85) state.spawnQueue.push(4);
      else if (w >= 5 && r > 0.72) state.spawnQueue.push(5);
      else if (w >= 4 && r > 0.58) state.spawnQueue.push(3);
      else if (w >= 4 && r > 0.48) state.spawnQueue.push(2);
      else if (w >= 6 && r > 0.40) state.spawnQueue.push(6);
      else if (w >= 2 && r > 0.22) state.spawnQueue.push(1);
      else state.spawnQueue.push(0);
    }

    if (w % 5 === 0) {
      state.spawnQueue.unshift(7);
      if (w >= 10) state.spawnQueue.unshift(7);
    }

    state.waveTotal = state.spawnQueue.length;
    state.spawnGap = Math.max(20, 65 - w * 2.5) / state.diff.speedMult;
    state.waveBreak = 210;
    state.bannerWave = w;
    state.bannerBoss = w % 5 === 0;
    state.bannerTimer = 140;
  }

  function spawnZombie(typeId, customX = null, customY = null) {
    const t = ZOMBIE_TYPES[typeId];
    const hpMult = state.diff.hpMult * (1 + state.wave * 0.08);
    const hp = t.hp * hpMult;
    const shieldHp = t.shieldHp ? t.shieldHp * hpMult : 0;

    Z.push({
      x: customX !== null ? customX : W + 36,
      y: customY !== null ? customY : rand(Y_MIN + 10, Y_MAX - 6),
      type: typeId,
      hp,
      maxHp: hp,
      shieldHp,
      maxShieldHp: shieldHp,
      atkCd: 20,
      specialCd: 110,
      phase: rand(0, Math.PI * 2),
      dir: -1,
      hitFlash: 0,
      chill: 0,
      fuseActive: false,
      dead: false
    });
  }

  function spawnCrate(x, y, boostWeapon = false) {
    const anyLocked = WEAPONS.some(w => w.id > 0 && players.some(p => !p.unlockedWeapons.includes(w.id)));
    const anySpecial = WEAPONS.filter(w => w.id > 0);
    const roll = Math.random();

    let payload;
    if ((boostWeapon || roll < 0.58) && anyLocked) {
      const candidates = WEAPONS.filter(w => w.id > 0 && players.some(p => !p.unlockedWeapons.includes(w.id)));
      const w = candidates[Math.floor(Math.random() * candidates.length)];
      payload = { kind: 'weapon', weaponId: w.id, ammo: w.packSize };
    } else if (anySpecial.length > 0 && roll < 0.88) {
      const w = anySpecial[Math.floor(Math.random() * anySpecial.length)];
      payload = { kind: 'ammo', weaponId: w.id, ammo: w.packSize };
    } else {
      const amt = 120 + state.wave * 15;
      payload = { kind: 'gold', amount: amt };
    }

    crates.push({ x, y, alt: 240, life: 1050, taken: false, payload });
  }

  function collectCrate(p, c) {
    c.taken = true;
    playSound('powerup');
    const pl = c.payload;
    if (pl.kind === 'weapon') {
      if (!p.unlockedWeapons.includes(pl.weaponId)) {
        p.unlockedWeapons.push(pl.weaponId);
      }
      p.ammo[pl.weaponId] = (p.ammo[pl.weaponId] || 0) + pl.ammo;
      p.weaponId = pl.weaponId;
      addFloatingText(p.x, p.y - 72, crateLabel(pl), '#ffc21a');
    } else if (pl.kind === 'ammo') {
      if (!p.unlockedWeapons.includes(pl.weaponId)) {
        p.unlockedWeapons.push(pl.weaponId);
      }
      p.ammo[pl.weaponId] = (p.ammo[pl.weaponId] || 0) + pl.ammo;
      if (p.weaponId === 0) p.weaponId = pl.weaponId;
      addFloatingText(p.x, p.y - 72, crateLabel(pl), '#ffc21a');
    } else {
      const g = Math.round(pl.amount * (1 + 0.2 * state.goldLvl));
      state.gold += g;
      state.totalGold += g;
      addFloatingText(p.x, p.y - 72, `+${g}`, '#ffc21a');
    }
    syncShopUI(true);
  }

  function addFloatingText(x, y, text, color = '#ffc21a') {
    texts.push({ x, y, text, color, life: 68 });
  }

  function castAbility(idx) {
    if (!running || paused) return;
    const ab = ABILITIES[idx];
    if (state.mana < ab.cost || state.abilityCd[idx] > 0) return;
    state.mana -= ab.cost;
    state.abilityCd[idx] = ab.cdMax;
    ab.action();
    syncAbilityDock();
  }

  function triggerAirstrike() {
    state.flashTimer = 22;
    playSound('explosion');
    addFloatingText(W * 0.58, Y_MIN + 30, tr('ab.4.m'), '#ffc21a');
    Z.forEach(z => {
      if (z.x < W + 25) hitZombie(z, 260, 4, true);
    });
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: rand(LINE_X + 20, W - 20),
        y: rand(Y_MIN, Y_MAX),
        vx: rand(-3, 3),
        vy: rand(-7, -1.5),
        life: 40,
        maxLife: 40,
        color: i % 2 ? '#ffc21a' : '#ef4444',
        size: 5
      });
    }
  }

  function cycleWeapon(p) {
    if (!p || p.deadTimer > 0) return;
    const avail = p.unlockedWeapons.filter(id => id === 0 || p.ammo[id] > 0);
    if (avail.length <= 1) {
      addFloatingText(p.x, p.y - 68, tr('float.noWeapon'), '#94a3b8');
      return;
    }
    const pos = avail.indexOf(p.weaponId);
    p.weaponId = avail[(pos + 1) % avail.length];
    addFloatingText(p.x, p.y - 68, wName(p.weaponId), '#ffc21a');
    playSound('buy');
  }

  function cycleAllMobileWeapons() {
    const activeFighters = players.filter(p => !p.isBot && p.deadTimer === 0);
    if (!activeFighters.length) return;
    activeFighters.forEach(p => cycleWeapon(p));
  }

  function cycleMobilePlayerWeapon(playerIdx) {
    const p = players[playerIdx];
    if (!p || p.isBot || p.deadTimer > 0) return;
    cycleWeapon(p);
  }

  function fireStraight(p) {
    let w = WEAPONS[p.weaponId];
    if (p.weaponId > 0 && p.ammo[p.weaponId] <= 0) {
      p.weaponId = 0;
      w = WEAPONS[0];
    }

    const effectiveCd = Math.max(24, w.cd / (1 + 0.16 * state.fireRateLvl));
    if (state.time - p.lastShot < effectiveCd) return;
    p.lastShot = state.time;
    p.recoil = 6;
    p.gunAnim = 1.0;
    p.gunAnimType = w.type;

    const dir = p.face;
    const dmgMult = 1 + 0.22 * state.dmgLvl;
    const s = sc(p.y);

    for (let i = 0; i < w.pellets; i++) {
      const vy = w.pellets > 1 ? rand(-2.2, 2.2) : 0;
      const yOffset = w.pellets > 1 ? rand(-6, 6) : 0;

      bullets.push({
        x: p.x + dir * 18,
        y: p.y + yOffset,
        vx: dir * w.speed,
        vy,
        dmg: w.dmg * dmgMult,
        pierce: w.pierce || 0,
        knock: w.knock || 1.6,
        chill: w.chill || 0,
        type: w.type,
        color: w.color,
        isBotShot: !!p.isBot,
        hitSet: new Set(),
        life: 62
      });
      if (!p.isBot) state.shotsFired++;
    }

    if (!p.isBot && p.weaponId > 0) {
      p.ammo[p.weaponId] = Math.max(0, p.ammo[p.weaponId] - 1);
      if (p.ammo[p.weaponId] === 0) {
        addFloatingText(p.x, p.y - 66, `${wName(w.id)}: 0`, '#ef4444');
        p.weaponId = 0;
      }
    }

    particles.push({ x: p.x + dir * 24 * s, y: p.y - 34 * s, vx: 0, vy: 0, life: 4, maxLife: 4, color: '#fff', size: 7 });
    shells.push({
      x: p.x,
      y: p.y - 34 * s,
      vx: -dir * rand(1.4, 2.6),
      vy: rand(-3.5, -1.5),
      groundY: p.y + rand(-2, 4),
      life: 60
    });

    playSound(w.type);
  }

  function hitZombie(z, dmg, knockVx = 0, bypassShield = false) {
    if (z.dead) return;
    const t = ZOMBIE_TYPES[z.type];
    const s = t.scale * sc(z.y);
    const cy = z.y - 30 * s;

    if (t.shield && z.shieldHp > 0 && !bypassShield && knockVx >= 0) {
      z.shieldHp -= dmg;
      z.hitFlash = 3;
      playSound('shieldHit');
      if (z.shieldHp <= 0) {
        z.shieldHp = 0;
        addFloatingText(z.x, cy - 38, tr('float.shieldBroken'), '#38bdf8');
      }
      return;
    }

    z.hp -= dmg;
    z.hitFlash = 4;
    if (!t.boss && !t.giant) {
      z.x += Math.sign(knockVx) * 2.0;
    }

    for (let i = 0; i < 3; i++) {
      particles.push({ x: z.x, y: cy, vx: rand(-2, 2), vy: rand(-3, 0), life: 18, maxLife: 18, color: '#80ed99', size: 3.5 });
    }

    if (z.hp <= 0) {
      z.dead = true;
      state.kills++;
      const goldGain = Math.round(t.gold * state.diff.goldMult * (1 + 0.2 * state.goldLvl));
      state.gold += goldGain;
      state.totalGold += goldGain;
      addFloatingText(z.x, cy - 32, `+${goldGain}`, '#ffc21a');
      playSound('coin');

      for (let i = 0; i < (t.boss ? 28 : 10); i++) {
        particles.push({ x: z.x, y: cy, vx: rand(-3.8, 3.8), vy: rand(-5.5, 0.5), life: 34, maxLife: 34, color: i % 2 ? '#74c69d' : '#ef4444', size: 4 });
      }
      if (t.bomber) explodeArea(z.x, z.y, 105, 95);
      if (t.boss) playSound('explosion');
    }
  }

  function explodeArea(x, y, radius, dmg) {
    shockwaves.push({ x, y: y - 16, r: 8, maxR: radius, color: '#ffc21a', life: 14 });
    playSound('explosion');
    Z.forEach(z => {
      if (!z.dead && Math.hypot(z.x - x, (z.y - y) * 1.5) < radius) {
        hitZombie(z, dmg, z.x - x, true);
      }
    });
  }

  function damageBarricadeAndCounter(z, dmgTaken) {
    const b = state.barricade;
    if (!b || b.level <= 0 || b.hp <= 0) return false;
    const cfg = BARRICADE_LEVELS[b.level - 1];

    b.hp -= dmgTaken;
    b.hitFlash = 6;
    hitZombie(z, cfg.thorns, 2.5, true);

    if (b.hp <= 0) {
      b.level -= 1;
      if (b.level > 0) {
        b.hp = BARRICADE_LEVELS[b.level - 1].hp;
        addFloatingText(LINE_X, Y_MIN + 46, tr('float.lineLvl', { n: b.level }), '#ffc21a');
      } else {
        b.hp = 0;
        addFloatingText(LINE_X, Y_MIN + 46, tr('float.lineGone'), '#ef4444');
      }
      playSound('explosion');
      syncShopUI(true);
    }
    return true;
  }

  function update() {
    state.time += 16.67;
    state.ticks++;

    const goldPerFrame = (0.035 + 0.025 * state.goldLvl) * state.diff.goldMult;
    state.gold += goldPerFrame;
    state.totalGold += goldPerFrame;
    state.mana = Math.min(state.maxMana, state.mana + 0.028 * (1 + 0.28 * state.manaLvl));

    if (state.slowTimer > 0) state.slowTimer--;
    if (state.shieldTimer > 0) state.shieldTimer--;
    if (state.flashTimer > 0) state.flashTimer--;
    if (state.baseHitFlash > 0) state.baseHitFlash--;
    if (state.barricade.hitFlash > 0) state.barricade.hitFlash--;
    if (state.bannerTimer > 0) state.bannerTimer--;
    for (let i = 0; i < 6; i++) if (state.abilityCd[i] > 0) state.abilityCd[i]--;

    players.forEach((p, idx) => {
      if (p.recoil > 0) p.recoil *= 0.7;
      if (p.gunAnim > 0) p.gunAnim = Math.max(0, p.gunAnim - 0.14);
      if (p.hitFlash > 0) p.hitFlash--;

      if (p.deadTimer > 0) {
        p.deadTimer--;
        if (p.deadTimer === 0) {
          p.hp = p.maxHp;
          p.x = 292;
          p.y = idx === 0 ? 360 : 445;
          p.face = 1;
        }
        return;
      }

      let mx = 0, my = 0;
      let firePressed = false;
      const pTouchDirs = touchDirsByPlayer[idx] || { up: null, down: null, left: null, right: null };
      const hasTouchDir = pTouchDirs.up !== null || pTouchDirs.down !== null || pTouchDirs.left !== null || pTouchDirs.right !== null;

      if (p.isBot) {
        const nearestCrate = crates.find(c => !c.taken && c.alt <= 0);
        const nearestZ = Z.find(z => !z.dead && z.x < W - 25);
        const patrolY = Y_MIN + 50 + Math.sin(state.ticks * 0.018 + p.idx) * 62;

        let goalX = clamp(LINE_X + 78 + Math.cos(state.ticks * 0.012) * 34, LINE_X + 24, W - 150);
        let goalY = clamp(patrolY, Y_MIN + 16, Y_MAX - 12);

        if (nearestCrate) {
          goalX = clamp(nearestCrate.x, LINE_X + 22, W - 30);
          goalY = clamp(nearestCrate.y, Y_MIN + 16, Y_MAX - 12);
        } else if (nearestZ) {
          goalY = clamp(nearestZ.y, Y_MIN + 16, Y_MAX - 12);
          goalX = clamp(nearestZ.x - 185, LINE_X + 26, W - 160);
        }

        const dx = goalX - p.x;
        const dy = goalY - p.y;
        if (Math.abs(dx) > 6) mx = clamp(dx / 45, -1, 1);
        if (Math.abs(dy) > 6) my = clamp(dy / 45, -1, 1);

        if (nearestZ && Math.abs(nearestZ.y - p.y) < 34 && nearestZ.x > p.x - 20) {
          p.face = nearestZ.x >= p.x ? 1 : -1;
          firePressed = true;
        } else {
          p.face = 1;
        }
      } else if (config.device === 'phone' && hasTouchDir) {
        mx = (pTouchDirs.right !== null ? 1 : 0) - (pTouchDirs.left !== null ? 1 : 0);
        my = (pTouchDirs.down !== null ? 1 : 0) - (pTouchDirs.up !== null ? 1 : 0);
      } else {
        const mk = idx === 0
          ? ['KeyA', 'KeyD', 'KeyW', 'KeyS']
          : ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
        mx = (keys[mk[1]] ? 1 : 0) - (keys[mk[0]] ? 1 : 0);
        my = (keys[mk[3]] ? 1 : 0) - (keys[mk[2]] ? 1 : 0);
      }

      const len = Math.hypot(mx, my) || 1;
      p.moving = (Math.abs(mx) > 0.05 || Math.abs(my) > 0.05);
      if (Math.abs(mx) > 0.08 && !firePressed) p.face = mx > 0 ? 1 : -1;

      const nextX = clamp(p.x + (mx / len) * 3.3, BX + 12, W - 20);
      const nextY = clamp(p.y + (my / len) * 2.7, Y_MIN, Y_MAX);

      const hasWall = state.barricade.level > 0 && state.barricade.hp > 0;
      const inGate = nextY >= GATE_Y_MIN && nextY <= GATE_Y_MAX;
      if (hasWall && !inGate) {
        if (p.x >= LINE_X + 12 && nextX < LINE_X + 12) {
          p.x = LINE_X + 12;
        } else if (p.x <= LINE_X - 12 && nextX > LINE_X - 12) {
          p.x = LINE_X - 12;
        } else {
          p.x = nextX;
        }
      } else {
        p.x = nextX;
      }
      p.y = nextY;

      if (!p.isBot) {
        if (config.device === 'phone') {
          firePressed = !!(touchFireState[idx] && touchFireState[idx].held);
        } else {
          firePressed = idx === 0
            ? !!(keys['KeyF'] || keys['Space'])
            : !!(keys['Slash'] || keys['ShiftRight'] || keys['Enter'] || keys['Numpad0']);
        }
      }

      if (firePressed) fireStraight(p);
    });

    const tMult = 1 + 0.25 * state.turretLvl;
    state.turrets.forEach((tur, idx) => {
      if (!tur) return;
      if (tur.recoil > 0) tur.recoil *= 0.75;
      const cfg = TURRET_TYPES[tur.type];
      const tp = turretPos(idx);
      const sx = tp.x;
      const sy = tp.y;

      let target = null;
      let minDist = cfg.range;
      Z.forEach(z => {
        if (z.dead || z.x > W + 10) return;
        const d = Math.hypot(z.x - sx, (z.y - 25) - sy);
        if (d < minDist) { minDist = d; target = z; }
      });

      if (target) {
        tur.angle = Math.atan2((target.y - 25) - sy, target.x - sx);
        if (--tur.cd <= 0) {
          tur.cd = Math.max(3, Math.round(cfg.cd / (1 + 0.12 * state.turretLvl)));
          tur.recoil = 5;
          const dmg = cfg.dmg * tMult;

          if (tur.type === 3) {
            let px = sx, py = sy;
            Z.filter(z => !z.dead && Math.hypot(z.x - target.x, z.y - target.y) < 160).slice(0, 4).forEach(z => {
              hitZombie(z, dmg, 1, true);
              beams.push({ x1: px, y1: py, x2: z.x, y2: z.y - 26, life: 7, color: '#e9d5ff', width: 2.5 });
              px = z.x; py = z.y - 26;
            });
          } else if (tur.type === 2) {
            explodeArea(target.x, target.y, 82, dmg);
            beams.push({ x1: sx, y1: sy, x2: target.x, y2: target.y - 24, life: 6, color: '#ffc21a', width: 3.5 });
          } else if (tur.type === 1) {
            hitZombie(target, dmg, 0.5, true);
            beams.push({ x1: sx, y1: sy, x2: target.x, y2: target.y - 24, life: 4, color: '#f97316', width: 5 });
          } else {
            hitZombie(target, dmg, 1.2, false);
            beams.push({ x1: sx, y1: sy, x2: target.x, y2: target.y - 24, life: 4, color: '#ffc21a', width: 2 });
          }
        }
      }
    });

    mines = mines.filter(m => {
      if (m.armed > 0) { m.armed--; return true; }
      for (const z of Z) {
        if (!z.dead && Math.hypot(z.x - m.x, (z.y - m.y) * 1.5) < 30) {
          explodeArea(m.x, m.y, 88, m.dmg);
          return false;
        }
      }
      return true;
    });

    crates.forEach(c => {
      if (c.alt > 0) c.alt -= 2.2;
      else c.life--;
      players.forEach(p => {
        if (!c.taken && c.alt <= 0 && p.deadTimer === 0 && Math.hypot(p.x - c.x, (p.y - c.y) * 1.5) < 36) {
          collectCrate(p, c);
        }
      });
    });
    crates = crates.filter(c => !c.taken && c.life > 0);
    if (--state.crateTimer <= 0) {
      const batch = 1 + Math.floor(state.wave / 4);
      for (let b = 0; b < batch; b++) {
        spawnCrate(rand(LINE_X + 60, W - 95), rand(Y_MIN + 22, Y_MAX - 16), b === 0 && state.wave >= 3);
      }
      const minDelay = Math.max(240, 680 - state.wave * 32);
      const maxDelay = Math.max(380, 980 - state.wave * 42);
      state.crateTimer = randInt(minDelay, maxDelay);
    }

    if (state.spawnQueue.length > 0) {
      if (++state.spawnTimer >= state.spawnGap) {
        state.spawnTimer = 0;
        spawnZombie(state.spawnQueue.pop());
      }
    } else if (Z.length === 0) {
      if (--state.waveBreak <= 0) startNextWave();
    }

    const hasWall = state.barricade.level > 0 && state.barricade.hp > 0;
    const wallCfg = hasWall ? BARRICADE_LEVELS[state.barricade.level - 1] : null;
    const wallFrontX = LINE_X + 18;

    Z.forEach(z => {
      if (z.dead) return;
      const t = ZOMBIE_TYPES[z.type];
      const zs = t.scale * sc(z.y);
      if (z.hitFlash > 0) z.hitFlash--;
      if (z.chill > 0) z.chill--;

      const blockedByWall = hasWall && z.x > BX && z.x <= wallFrontX + 4;
      let targetX = hasWall ? wallFrontX : BX;
      let targetY = z.y;
      let targetDist = Math.max(0, z.x - targetX);
      let targetPlayer = null;
      let hittingBarricade = blockedByWall;

      players.forEach(p => {
        if (p.deadTimer > 0) return;
        if (hasWall && z.x > wallFrontX - 2 && p.x < wallFrontX - 2) return;
        const d = Math.hypot(z.x - p.x, (z.y - p.y) * 1.45);
        if (d < targetDist && d < 210) {
          targetDist = d;
          targetPlayer = p;
          targetX = p.x;
          targetY = p.y;
          hittingBarricade = false;
        }
      });

      if (t.bomber && targetDist < 165) z.fuseActive = true;

      const slowFactor = (state.slowTimer > 0 || z.chill > 0) ? 0.42 : 1.0;
      const fuseBoost = z.fuseActive ? 1.45 : 1.0;
      const spd = t.speed * state.diff.speedMult * (1 + state.wave * 0.01) * slowFactor * fuseBoost;

      if (!hittingBarricade && targetDist > 21 * zs) {
        const dx = targetX - z.x;
        const dy = targetY - z.y;
        const m = Math.hypot(dx, dy) || 1;
        let nextX = z.x + (dx / m) * spd;
        let nextY = clamp(z.y + (dy / m) * spd * 0.8, Y_MIN, Y_MAX);

        if (hasWall && z.x >= wallFrontX && nextX < wallFrontX) {
          nextX = wallFrontX;
          hittingBarricade = true;
        }

        z.x = nextX;
        z.y = nextY;
        z.dir = dx < 0 ? -1 : 1;
        z.phase += 0.11 + t.speed * 0.12;
      }

      if (hittingBarricade || (!targetPlayer && targetDist <= 21 * zs && hasWall)) {
        if (t.bomber) {
          z.dead = true;
          explodeArea(z.x, z.y, 110, 105);
          return;
        }
        if (wallCfg && state.ticks % 30 === 0) {
          hitZombie(z, Math.max(4, wallCfg.thorns * 0.45), 1.5, true);
          if (z.dead) return;
        }
        if (--z.atkCd <= 0) {
          z.atkCd = 36;
          damageBarricadeAndCounter(z, t.dmg);
        }
      } else if (targetDist <= 21 * zs) {
        if (t.bomber) {
          z.dead = true;
          explodeArea(z.x, z.y, 110, 105);
          return;
        }
        if (--z.atkCd <= 0) {
          z.atkCd = 42;
          if (targetPlayer) {
            targetPlayer.hp -= t.dmg;
            targetPlayer.hitFlash = 8;
            if (targetPlayer.hp <= 0) { targetPlayer.hp = 0; targetPlayer.deadTimer = 330; }
          } else if (state.shieldTimer <= 0) {
            state.baseHp -= t.dmg;
            state.baseHitFlash = 8;
            if (state.baseHp <= 0) { state.baseHp = 0; endGame(); }
          }
        }
      }
      z.y = clamp(z.y, Y_MIN, Y_MAX);
    });

    bullets = bullets.filter(b => {
      b.x += b.vx;
      b.y += b.vy;
      if (--b.life <= 0 || b.x < BX - 10 || b.x > W + 25 || b.y < Y_MIN - 25 || b.y > Y_MAX + 25) return false;

      for (const z of Z) {
        if (z.dead || b.hitSet.has(z)) continue;
        const s = ZOMBIE_TYPES[z.type].scale * sc(z.y);
        if (Math.abs(b.x - z.x) < 15 * s && Math.abs(b.y - z.y) < 20 * sc(z.y)) {
          b.hitSet.add(z);
          if (!b.isBotShot) state.shotsHit++;
          hitZombie(z, b.dmg, b.vx * (b.knock / 1.6), b.type === 'plasma');
          if (b.chill > 0) z.chill = Math.max(z.chill, b.chill);
          if (b.pierce-- <= 0) return false;
        }
      }
      return true;
    });

    Z = Z.filter(z => !z.dead);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life--; });
    particles = particles.filter(p => p.life > 0);
    shells.forEach(sh => { if (sh.y < sh.groundY) { sh.x += sh.vx; sh.y += sh.vy; sh.vy += 0.35; } sh.life--; });
    shells = shells.filter(sh => sh.life > 0);
    beams.forEach(bm => bm.life--);
    beams = beams.filter(bm => bm.life > 0);
    shockwaves.forEach(sw => { sw.r += (sw.maxR - sw.r) * 0.22; sw.life--; });
    shockwaves = shockwaves.filter(sw => sw.life > 0);
    texts.forEach(t => { t.y -= 0.55; t.life--; });
    texts = texts.filter(t => t.life > 0);

    if (state.ticks % 6 === 0) {
      syncShopUI(false);
      syncAbilityDock();
    }
  }

  function endGame() {
    running = false;
    paused = false;
    accumulator = 0;
    clearTouchInputs();
    applyDeviceMode();
    renderGameOver();
    $('screen-gameover').classList.remove('hidden');
    syncShopUI(true);
    syncAbilityDock();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, Y_MIN);
    sky.addColorStop(0, '#090d16');
    sky.addColorStop(0.6, '#152232');
    sky.addColorStop(1, '#26394c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, Y_MIN);

    ctx.fillStyle = '#1b2838';
    ctx.beginPath();
    ctx.moveTo(0, Y_MIN);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, Y_MIN - (56 + Math.abs(Math.sin(x * 0.012)) * 68));
    }
    ctx.lineTo(W, Y_MIN);
    ctx.fill();

    ctx.fillStyle = '#24422b';
    ctx.fillRect(0, Y_MIN - 10, W, 20);

    const road = ctx.createLinearGradient(0, Y_MIN, 0, H);
    road.addColorStop(0, '#3a424d');
    road.addColorStop(1, '#181d24');
    ctx.fillStyle = road;
    ctx.fillRect(0, Y_MIN + 6, W, H - Y_MIN);

    roadMarks.forEach(m => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, m.w, m.w * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawBarricade() {
    const b = state.barricade;
    if (!b || b.level <= 0 || b.hp <= 0) return;
    const cfg = BARRICADE_LEVELS[b.level - 1];
    const flash = b.hitFlash > 0;

    const segments = [
      [Y_MIN, GATE_Y_MIN],
      [GATE_Y_MAX, Y_MAX]
    ];

    segments.forEach(([y1, y2]) => {
      if (y2 <= y1) return;
      if (cfg.isWire) {
        for (let y = y1 + 8; y < y2 - 4; y += 20) {
          ctx.fillStyle = '#334155';
          ctx.fillRect(LINE_X - 2, y - 9, 4, 12);
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.ellipse(LINE_X, y + 3, 5, 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = flash ? '#ffffff' : '#94a3b8';
        ctx.lineWidth = 1.6;
        for (let y = y1 + 4; y < y2 - 5; y += 8) {
          ctx.beginPath();
          ctx.ellipse(LINE_X, y + 3, 8, 4.2, 0.25, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else {
        const w = 18 + Math.min(6, cfg.tier);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.36)';
        ctx.fillRect(LINE_X - w * 0.5 - 3, y1 + 2, w + 8, y2 - y1);

        for (let y = y1 + 2; y < y2 - 7; y += 12) {
          ctx.fillStyle = flash ? '#fff' : '#786246';
          ctx.beginPath();
          ctx.roundRect(LINE_X - w * 0.5 - 2, y, w + 4, 10, 3);
          ctx.fill();
          ctx.strokeStyle = '#2d2419';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        const wallGrad = ctx.createLinearGradient(LINE_X - w * 0.5, 0, LINE_X + w * 0.5, 0);
        wallGrad.addColorStop(0, flash ? '#ffffff' : '#475569');
        wallGrad.addColorStop(0.5, flash ? '#ffffff' : '#334155');
        wallGrad.addColorStop(1, flash ? '#ffffff' : '#1e293b');
        ctx.fillStyle = wallGrad;
        ctx.fillRect(LINE_X - w * 0.42, y1, w * 0.84, y2 - y1);

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.4;
        ctx.strokeRect(LINE_X - w * 0.42, y1, w * 0.84, y2 - y1);
      }
    });

    const gateMidY = (GATE_Y_MIN + GATE_Y_MAX) * 0.5;
    ctx.fillStyle = 'rgba(16, 185, 129, 0.14)';
    ctx.fillRect(LINE_X - 14, GATE_Y_MIN, 28, GATE_Y_MAX - GATE_Y_MIN);

    [GATE_Y_MIN, GATE_Y_MAX].forEach(gy => {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(LINE_X - 9, gy - 4, 18, 8);
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(LINE_X - 9, gy - 4, 18, 8);

      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(LINE_X, gy, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.strokeStyle = 'rgba(52, 211, 153, 0.85)';
    ctx.lineWidth = 1.8;
    [-6, 4].forEach(ox => {
      ctx.beginPath();
      ctx.moveTo(LINE_X + ox - 3, gateMidY - 5);
      ctx.lineTo(LINE_X + ox + 3, gateMidY);
      ctx.lineTo(LINE_X + ox - 3, gateMidY + 5);
      ctx.stroke();
    });
  }

    state.turrets.forEach((tur, idx) => {
      if (!tur) return;
      const cfg = TURRET_TYPES[tur.type];

    if (state.shieldTimer > 0) {

      ctx.fillStyle = `rgba(56, 189, 248, ${pulse})`;
      ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
      ctx.lineWidth = 2.5;
      ctx.fillRect(BX + 2, 100, 14, H - 100);

    ctx.restore();
