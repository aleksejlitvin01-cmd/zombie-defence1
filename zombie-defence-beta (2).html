  function drawGunModel(weaponId, color, anim = 0) {
    const kick = anim * anim;
    if (weaponId === 1) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(-2, -3.5, 24, 6);
      ctx.fillStyle = '#b45309';
      ctx.fillRect(7, -3, 10, 5.5);
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.roundRect(8, 2.5, 6, 8, 2);
      ctx.fill();
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(21, -2, 8, 2.5);
      if (kick > 0.05) {
        ctx.fillStyle = 'rgba(255, 224, 102, ' + (kick * 0.65).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(31, -0.8, 3.5 * kick + 1, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (weaponId === 2) {
      const pumpShift = Math.sin(anim * Math.PI) * 3.5;
      ctx.fillStyle = '#78350f';
      ctx.fillRect(-3, -3, 11, 5.5);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(7, -3, 23, 3.5);
      ctx.fillStyle = '#d97706';
      ctx.fillRect(12 - pumpShift, 0.5, 10, 3.5);
    } else if (weaponId === 3) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-4, -3, 35, 4);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(4, -7.5, 12, 3.5);
      ctx.fillStyle = '#334155';
      ctx.fillRect(-5, -2.5, 9, 5);
      if (kick > 0.05) {
        ctx.strokeStyle = 'rgba(56, 189, 248, ' + (kick * 0.7).toFixed(2) + ')';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(31, -1);
        ctx.lineTo(39, -1);
        ctx.stroke();
      }
    } else if (weaponId === 4) {
      ctx.fillStyle = '#0e7490';
      ctx.beginPath();
      ctx.roundRect(-2, -4.5, 25, 9, 2.5);
      ctx.fill();
      ctx.fillStyle = kick > 0.1 ? '#a5f3fc' : '#22d3ee';
      ctx.fillRect(5, -2, 12 + kick * 2, 4);
    } else if (weaponId === 5) {
      const barrelSpin = Math.sin(anim * Math.PI * 2) * 1.6;
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(-3, -5, 13, 10, 2);
      ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(9, -4 + barrelSpin * 0.3, 21, 2.5);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(9, -1, 21, 2.5);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(9, 2 - barrelSpin * 0.3, 21, 2.5);
    } else {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-1, -3, 17, 5.5);
      ctx.fillStyle = color;
      ctx.fillRect(4, -2, 7, 2.5);
      if (kick > 0.05) {
        ctx.fillStyle = 'rgba(255, 194, 26, ' + (kick * 0.6).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(18, -0.5, 2.6 * kick + 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawPlayer(p, idx) {
    if (p.deadTimer > 0) return;
    const s = sc(p.y) * 1.04;

    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 3, 16 * s, 5.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(s, s);

    const walk = p.moving ? Math.sin(state.time / 65) * 6 : 0;

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(-7 + walk * 0.5, -20, 6, 20);
    ctx.fillRect(1 - walk * 0.5, -20, 6, 20);

    ctx.fillStyle = '#334155';
    ctx.fillRect(p.face > 0 ? -13 : 7, -44, 6, 20);

    ctx.fillStyle = p.hitFlash > 0 ? '#fff' : p.color;
    ctx.beginPath();
    ctx.roundRect(-10, -46, 20, 28, 4);
    ctx.fill();
    ctx.fillStyle = p.darkColor;
    ctx.fillRect(-8, -42, 16, 16);

    ctx.fillStyle = '#f1c27d';
    ctx.beginPath();
    ctx.arc(0, -54, 9.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = idx === 0 ? '#b45309' : '#0284c7';
    ctx.beginPath();
    ctx.arc(0, -56, 10.5, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = idx === 0 ? '#fef08a' : '#bae6fd';
    ctx.fillRect(p.face > 0 ? 2 : -9, -56, 7, 3);

    ctx.save();
    ctx.translate(0, -34);
    ctx.scale(p.face, 1);
    ctx.rotate(-0.18 * (p.gunAnim || 0));
    ctx.translate(-p.recoil, 0);
    drawGunModel(p.weaponId, WEAPONS[p.weaponId].color, p.gunAnim || 0);
    ctx.restore();

    ctx.fillStyle = p.color;
    ctx.font = '800 12px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.isBot ? tr('hud.bot') : (idx === 0 ? '1' : '2'), 0, -72);

    ctx.restore();
  }

  function drawZombie(z) {
    const t = ZOMBIE_TYPES[z.type];
    const s = t.scale * sc(z.y);
    const walk = Math.sin(z.phase) * (t.runner ? 9 : 6);
    const armSwing = Math.cos(z.phase) * 2.5;

    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath();
    ctx.ellipse(z.x, z.y + 3, 18 * s, 6 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    if (t.berserk || t.boss) {
      const pulse = 0.2 + 0.1 * Math.sin(state.ticks * 0.15 + z.phase);
      ctx.fillStyle = t.boss ? `rgba(255, 194, 26, ${pulse})` : `rgba(239, 68, 68, ${pulse})`;
      ctx.beginPath();
      ctx.ellipse(z.x, z.y + 1, 24 * s, 8 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(z.x, z.y);
    ctx.scale(z.dir * s, s);
    if (t.runner) ctx.rotate(0.22);
    if (t.berserk) ctx.rotate(0.12);

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-7 + walk * 0.5, -20, 6, 20);
    ctx.fillRect(1 - walk * 0.5, -20, 6, 20);
    ctx.fillStyle = '#334155';
    ctx.fillRect(-7 + walk * 0.5, -4, 7, 4);
    ctx.fillRect(1 - walk * 0.5, -4, 7, 4);

    let skin = t.skin;
    let coat = t.coat;
    if (z.hitFlash > 0) { skin = '#fff'; coat = '#fff'; }
    else if (z.chill > 0 || state.slowTimer > 0) { skin = '#7dd3fc'; }

    ctx.fillStyle = coat;
    ctx.beginPath();
    ctx.roundRect(-10, -47, 20, 29, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(15, 23, 42, 0.75)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = skin;
    ctx.fillRect(5, -43 + armSwing * 0.4, 18, 5.5);
    ctx.fillRect(5, -34 - armSwing * 0.4, 16, 5.5);

    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.arc(0, -55, 10.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = t.boss || t.berserk ? '#ffc21a' : '#ef4444';
    ctx.fillRect(3, -58, 4.5, 3.5);

    if (t.shield && z.shieldHp > 0) {
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.roundRect(12, -53, 8, 48, 3);
      ctx.fill();
      ctx.stroke();
    }
    if (t.bomber) {
      const blink = z.fuseActive && Math.floor(state.ticks / 5) % 2 === 0;
      ctx.fillStyle = blink ? '#fff' : '#ef4444';
      ctx.beginPath();
      ctx.roundRect(-15, -48, 9, 24, 4);
      ctx.fill();
    }
    if (t.boss) {
      ctx.fillStyle = '#ffc21a';
      ctx.beginPath();
      ctx.moveTo(-8, -64); ctx.lineTo(-5, -75); ctx.lineTo(-1, -65);
      ctx.lineTo(3, -76); ctx.lineTo(7, -64);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();

    if (t.shield && z.shieldHp > 0) {
      drawBar(z.x - 22 * s, z.y - 78 * s, 44 * s, 4, z.shieldHp / z.maxShieldHp, '#38bdf8');
    } else if (z.hp < z.maxHp && (t.scale > 1.08 || t.boss)) {
      const bw = 48 * s;
      drawBar(z.x - bw / 2, z.y - 82 * s, bw, 5, z.hp / z.maxHp, t.boss ? '#ffc21a' : '#ef4444');
    }
  }

  function drawCrate(c) {
    if (c.alt <= 0 && c.life <= 300 && Math.floor(c.life / 8) % 2 === 1) return;

    const y = c.y - Math.max(0, c.alt);
    const s = sc(c.y);

    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + 3, 17 * s, 5.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    if (c.alt > 0) {
      ctx.strokeStyle = 'rgba(248, 250, 252, 0.85)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(c.x - 20, y - 54); ctx.lineTo(c.x - 12, y - 16);
      ctx.moveTo(c.x, y - 58); ctx.lineTo(c.x, y - 16);
      ctx.moveTo(c.x + 20, y - 54); ctx.lineTo(c.x + 12, y - 16);
      ctx.stroke();

      ctx.fillStyle = '#ffc21a';
      ctx.beginPath();
      ctx.arc(c.x, y - 54, 22, Math.PI, 0);
      ctx.fill();
    }

    ctx.fillStyle = '#151a24';
    ctx.fillRect(c.x - 15, y - 18, 30, 18);
    ctx.strokeStyle = '#ffc21a';
    ctx.lineWidth = 2;
    ctx.strokeRect(c.x - 15, y - 18, 30, 18);

    ctx.fillStyle = '#ffc21a';
    ctx.fillRect(c.x - 9, y - 11, 18, 4);
  }

  function drawBar(x, y, w, h, ratio, color) {
    ctx.fillStyle = 'rgba(7, 9, 13, 0.78)';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 3);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w * clamp(ratio, 0, 1), h, 3);
    ctx.fill();
  }

  function drawHUD() {
    ctx.textAlign = 'left';

    const hasBarricade = state.barricade && state.barricade.level > 0 && state.barricade.hp > 0;
    const panelH = hasBarricade ? 86 : 70;

    ctx.fillStyle = 'rgba(13, 16, 23, 0.92)';
    ctx.strokeStyle = '#ffc21a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(10, 8, 210, panelH, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 10.5px "Segoe UI", sans-serif';
    ctx.fillText(`${tr('hud.base')} ${Math.ceil(state.baseHp)}/${state.maxBaseHp}`, 18, 24);
    drawBar(100, 15, 108, 9, state.baseHp / state.maxBaseHp, state.shieldTimer > 0 ? '#38bdf8' : '#ef4444');

    ctx.fillText(`${tr('hud.mana')} ${Math.floor(state.mana)}/${state.maxMana}`, 18, 42);
    drawBar(100, 33, 108, 9, state.mana / state.maxMana, '#ffc21a');

    ctx.fillStyle = '#ffc21a';
    ctx.font = '800 11px "Segoe UI", sans-serif';
    ctx.fillText(`${tr('hud.wave')} ${state.wave} • ${tr('diff.' + state.diff.id)}`, 18, 63);
    const rem = state.spawnQueue.length + Z.length;
    drawBar(126, 54, 82, 8, 1 - rem / Math.max(1, state.waveTotal), '#ffc21a');

    if (hasBarricade) {
      const maxBarHp = BARRICADE_LEVELS[state.barricade.level - 1].hp;
      ctx.fillStyle = '#34d399';
      ctx.font = '700 10px "Segoe UI", sans-serif';
      ctx.fillText(`${tr('hud.line')} ${Math.ceil(state.barricade.hp)}/${maxBarHp}`, 18, 82);
      drawBar(100, 73, 108, 8, state.barricade.hp / maxBarHp, '#10b981');
    }

    players.forEach((p, idx) => {
      const px = 228 + idx * 196;
      const w = WEAPONS[p.weaponId];
      const ammoStr = p.weaponId === 0 ? '∞' : String(p.ammo[p.weaponId] || 0);

      ctx.fillStyle = 'rgba(13, 16, 23, 0.92)';
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(px, 8, 188, 50, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.roundRect(px + 8, 15, 26, 28, 5);
      ctx.fill();

      ctx.fillStyle = '#07090d';
      ctx.font = '900 10.5px "Segoe UI", sans-serif';
      ctx.fillText(p.isBot ? tr('hud.botShort') : (idx === 0 ? '1' : '2'), px + 15, 33);

      drawBar(px + 40, 14, 138, 8, p.hp / p.maxHp, '#10b981');

      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 10.5px "Segoe UI", sans-serif';
      if (p.deadTimer > 0) {
        ctx.fillText(tr('hud.respawn', { n: Math.ceil(p.deadTimer / 60) }), px + 40, 38);
      } else {
        ctx.fillText(`${wName(w.id)}: ${ammoStr}`, px + 40, 38);
      }

      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 9px "Segoe UI", sans-serif';
      ctx.fillText(p.isBot ? tr('hud.ally') : (idx === 0 ? tr('hud.ctrl1') : tr('hud.ctrl2')), px + 40, 51);
    });
  }

  function render() {
    drawBackground();
    drawBase();
    drawBarricade();

    mines.forEach(m => {
      ctx.fillStyle = '#11161f';
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, 9, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffc21a';
      ctx.fillRect(m.x - 2, m.y - 3, 4, 3);
    });

    const items = [
      ...Z.map(z => ({ y: z.y, fn: () => drawZombie(z) })),
      ...players.map((p, i) => ({ y: p.y, fn: () => drawPlayer(p, i) })),
      ...crates.map(c => ({ y: c.y, fn: () => drawCrate(c) }))
    ];
    items.sort((a, b) => a.y - b.y);
    items.forEach(it => it.fn());

    ctx.fillStyle = '#ffc21a';
    shells.forEach(sh => ctx.fillRect(sh.x, sh.y, 3, 2));

    beams.forEach(bm => {
      ctx.strokeStyle = bm.color;
      ctx.lineWidth = bm.width;
      ctx.beginPath();
      ctx.moveTo(bm.x1, bm.y1);
      ctx.lineTo(bm.x2, bm.y2);
      ctx.stroke();
    });

    shockwaves.forEach(sw => {
      ctx.globalAlpha = clamp(sw.life / 15, 0, 0.8);
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.45, 0, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    bullets.forEach(b => {
      const h = 34 * sc(b.y);
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.type === 'sniper' ? 3.5 : 2.2;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - h);
      ctx.lineTo(b.x - b.vx * 1.15, b.y - h - b.vy * 1.15);
      ctx.stroke();
    });

    particles.forEach(p => {
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    ctx.font = '800 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    texts.forEach(t => {
      ctx.globalAlpha = clamp(t.life / 25, 0, 1);
      ctx.fillStyle = '#000';
      ctx.fillText(t.text, t.x + 1, t.y + 1);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    });
    ctx.globalAlpha = 1;

    if (state.flashTimer > 0) {
      ctx.fillStyle = `rgba(255, 224, 102, ${state.flashTimer / 34})`;
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();

    if (state.bannerTimer > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(state.bannerTimer / 35, 0, 1);
      ctx.font = '900 36px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      ctx.fillText(bannerLabel(), W * 0.56 + 3, 145 + 3);
      ctx.fillStyle = '#ffc21a';
      ctx.fillText(bannerLabel(), W * 0.56, 145);
      ctx.restore();
    }
  }

  function bindOptionGroup(groupId, key) {
    const grp = $(groupId);
    grp.querySelectorAll('.seg-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.currentTarget.blur();
        grp.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        config[key] = Number(btn.dataset.val);
        if (key === 'players') applyDeviceMode();
      });
    });
  }

  bindOptionGroup('opt-players', 'players');
  bindOptionGroup('opt-diff', 'diff');

  document.querySelectorAll('.dev-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.currentTarget.blur();
      config.device = btn.dataset.dev;
      syncDeviceButtons();
      applyDeviceMode();
    });
  });

  $('btn-start').addEventListener('click', e => { e.currentTarget.blur(); startGame(); });
  $('btn-restart').addEventListener('click', e => { e.currentTarget.blur(); startGame(); });

  $('btn-pause').addEventListener('click', e => {
    e.currentTarget.blur();
    if (!running) return;
    paused = !paused;
    accumulator = 0;
    lastTime = performance.now();
    $('screen-pause').classList.toggle('hidden', !paused);
    applyDeviceMode();
    syncAbilityDock();
  });

  $('btn-resume').addEventListener('click', e => {
    e.currentTarget.blur();
    paused = false;
    accumulator = 0;
    lastTime = performance.now();
    $('screen-pause').classList.add('hidden');
    applyDeviceMode();
    syncAbilityDock();
  });

  const backToMenu = e => {
    if (e && e.currentTarget) e.currentTarget.blur();
    running = false;
    paused = false;
    accumulator = 0;
    clearTouchInputs();
    $('screen-pause').classList.add('hidden');
    $('screen-gameover').classList.add('hidden');
    $('screen-menu').classList.remove('hidden');
    applyDeviceMode();
    syncShopUI(true);
    syncAbilityDock();
  };
  $('btn-menu-pause').addEventListener('click', backToMenu);
  $('btn-menu-over').addEventListener('click', backToMenu);

  $('btn-audio').addEventListener('click', e => {
    e.currentTarget.blur();
    soundEnabled = !soundEnabled;
    $('btn-audio').innerHTML = soundEnabled ? ICONS.soundOn : ICONS.soundOff;
  });

  document.querySelectorAll('.tab-switch').forEach(btn => {
    btn.addEventListener('click', e => {
      e.currentTarget.blur();
      document.querySelectorAll('.tab-switch').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      syncShopUI(true);
    });
  });

  function bindDpadButton(btn) {
    const dir = btn.dataset.dir;
    const pIdx = Number(btn.dataset.player || 0);

    const onDown = e => {
      if (!running || paused || config.device !== 'phone') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      e.preventDefault();
      e.stopPropagation();

      releasePointer(e.pointerId);

      try { btn.setPointerCapture(e.pointerId); } catch (_) {}

      touchDirsByPlayer[pIdx][dir] = e.pointerId;
      activePointers.set(e.pointerId, {
        type: 'dir',
        player: pIdx,
        dir,
        element: btn
      });
      syncDpadPressedClasses();
    };

    const onUp = e => {
      e.preventDefault();
      e.stopPropagation();
      releasePointer(e.pointerId);
    };

    btn.addEventListener('pointerdown', onDown, { passive: false });
    btn.addEventListener('pointerup', onUp, { passive: false });
    btn.addEventListener('pointercancel', onUp, { passive: false });
    btn.addEventListener('lostpointercapture', onUp, { passive: false });
  }

  document.querySelectorAll('.dpad-btn').forEach(bindDpadButton);

  function bindFireButton(btnId, pIdx) {
    const fireBtn = $(btnId);
    if (!fireBtn) return;

    const onDown = e => {
      if (!running || paused || config.device !== 'phone') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      e.preventDefault();
      e.stopPropagation();

      releasePointer(e.pointerId);
      try { fireBtn.setPointerCapture(e.pointerId); } catch (_) {}

      touchFireState[pIdx].id = e.pointerId;
      activePointers.set(e.pointerId, {
        type: 'fire',
        player: pIdx,
        element: fireBtn
      });
      setFirePressed(pIdx, true);
    };

    const onUp = e => {
      e.preventDefault();
      e.stopPropagation();
      releasePointer(e.pointerId);
    };

    fireBtn.addEventListener('pointerdown', onDown, { passive: false });
    fireBtn.addEventListener('pointerup', onUp, { passive: false });
    fireBtn.addEventListener('pointercancel', onUp, { passive: false });
    fireBtn.addEventListener('lostpointercapture', onUp, { passive: false });
  }

  bindFireButton('t-fire', 0);
  bindFireButton('t-fire-p2', 1);

  function bindSwitchButton(btnId, actionFn) {
    const swBtn = $(btnId);
    if (!swBtn) return;

    let lastPointerAt = -1e9;

    swBtn.addEventListener('pointerdown', e => {
      if (!running || paused || config.device !== 'phone') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;

      e.preventDefault();
      e.stopPropagation();
      lastPointerAt = performance.now();

      try { swBtn.setPointerCapture(e.pointerId); } catch (_) {}
      actionFn();
    }, { passive: false });

    // pointerup приходить ДО click, тому прапорець скидався і зброя перемикалась двічі.
    // Тепер click, що йде одразу після pointerdown, ігнорується (клавіатурний click працює).
    swBtn.addEventListener('click', e => {
      e.preventDefault();
      e.currentTarget.blur();

      if (performance.now() - lastPointerAt < 700) return;
      if (running && !paused) actionFn();
    });
  }

  bindSwitchButton('t-switch', () => {
    if (config.players === 2) cycleMobilePlayerWeapon(0);
    else cycleAllMobileWeapons();
  });
  bindSwitchButton('t-switch-p2', () => cycleMobilePlayerWeapon(1));

  window.addEventListener('pointerup', e => releasePointer(e.pointerId));
  window.addEventListener('pointercancel', e => releasePointer(e.pointerId));

  if (!window.PointerEvent) {
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      const pIdx = Number(btn.dataset.player || 0);

      btn.addEventListener('touchstart', e => {
        if (!running || paused || config.device !== 'phone') return;
        e.preventDefault();
        const t = e.changedTouches[0];
        if (!t) return;
        touchDirsByPlayer[pIdx][dir] = t.identifier;
        syncDpadPressedClasses();
      }, { passive: false });

      const end = e => {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (touchDirsByPlayer[pIdx][dir] === t.identifier) {
            touchDirsByPlayer[pIdx][dir] = null;
          }
        }
        syncDpadPressedClasses();
      };
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
    });

    ['t-fire', 't-fire-p2'].forEach((id, pIdx) => {
      const btn = $(id);
      if (!btn) return;
      btn.addEventListener('touchstart', e => {
        if (!running || paused || config.device !== 'phone') return;
        e.preventDefault();
        touchFireState[pIdx].id = e.changedTouches[0]?.identifier ?? null;
        setFirePressed(pIdx, true);
      }, { passive: false });
      const end = e => {
        e.preventDefault();
        touchFireState[pIdx].id = null;
        setFirePressed(pIdx, false);
      };
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
    });
  }

  const clearKeys = () => { for (const k in keys) keys[k] = false; };

  window.addEventListener('blur', () => {
    activePointers.forEach((_, id) => releasePointer(id));
    clearTouchInputs();
    clearKeys();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTouchInputs();
      clearKeys();
    } else {
      accumulator = 0;
      lastTime = performance.now();
    }
  });

  window.addEventListener('keydown', e => {
    const code = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) {
      e.preventDefault();
    }
    keys[code] = true;
    if (e.repeat) return;

    if (code === 'Escape' && running) {
      $('btn-pause').click();
      return;
    }
    if (code === 'KeyM' && !running) {
      $('btn-audio').click();
      return;
    }
    if (!running || paused) return;

    if (code === 'KeyE') cycleWeapon(players[0]);
    if (code === 'KeyU' && players[1] && !players[1].isBot) cycleWeapon(players[1]);

    if (code === 'KeyM') castAbility(0);
    if (code === 'KeyQ') castAbility(4);
    if (code === 'KeyO') castAbility(4);
    if (code === 'Digit1') castAbility(1);
    if (code === 'Digit2') castAbility(2);
    if (code === 'Digit3') castAbility(3);
    if (code === 'Digit4') castAbility(4);
    if (code === 'Digit5') castAbility(5);
  });

  window.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  let lastTime = performance.now();
  let accumulator = 0;
  const STEP = 1000 / 60;

  function loop(timestamp) {
    const dt = Math.min(100, Math.max(0, timestamp - lastTime));
    lastTime = timestamp;

    if (running && !paused) {
      accumulator += dt;
      while (accumulator >= STEP) {
        update();
        accumulator -= STEP;
        if (!running) break;
      }
    }

    if (state) render();
    requestAnimationFrame(loop);
  }

  hydrateStaticIcons();
  buildLangSwitches();
  applyStaticI18n();
  syncDeviceButtons();
  buildAbilityDock();
  applyDeviceMode();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
